<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Müşteri & Admin Sistemi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial}
body{
  margin:0;
  min-height:100vh;
  background:#0f0c29;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  color:#fff;
}
.hidden{display:none}

/* ORTA KUTU */
.box{
  max-width:420px;
  margin:70px auto;
  background:#111;
  padding:25px;
  border-radius:12px;
}

/* BUTONLAR */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
input{
  width:100%;
  padding:12px;
  margin:8px 0;
}

/* MÜŞTERİ STİL */
.customer-box{
  background:linear-gradient(135deg,#00f260,#0575e6);
}
.customer-box h2{text-align:center}
.customer-box button{background:#000;color:#0ff}

/* ADMIN STİL */
.admin-box{
  background:#1c1c1c;
  border:2px solid #555;
}
.admin-box h2{text-align:center}
.admin-box button{background:#444;color:#fff}

/* PANELLER */
.panel{
  max-width:900px;
  margin:40px auto;
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:12px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
a{cursor:pointer;color:#0ff;font-weight:bold}
</style>
</head>
<body>

<!-- ANA SAYFA -->
<div class="box">
  <h2 style="text-align:center">Hoş Geldiniz</h2>
  <button onclick="show('customerLogin')">Müşteri Girişi</button>
  <button onclick="show('adminLogin')">Yönetim Girişi</button>
</div>

<!-- MÜŞTERİ GİRİŞ -->
<div class="box customer-box hidden" id="customerLogin">
  <h2>Müşteri Girişi</h2>
  <input id="cUser" placeholder="Kullanıcı Adı">
  <input id="cPass" type="password" placeholder="Şifre">
  <button onclick="customerLogin()">Giriş Yap</button>
  <a onclick="show('customerRegister')">Kayıt Ol</a>
</div>

<!-- MÜŞTERİ KAYIT -->
<div class="box customer-box hidden" id="customerRegister">
  <h2>Müşteri Kayıt</h2>
  <input id="rUser" placeholder="Kullanıcı Adı">
  <input id="rMail" placeholder="E-posta">
  <input id="rPass" type="password" placeholder="Şifre">
  <button onclick="register()">Kayıt Ol</button>
  <a onclick="location.reload()">Ana Sayfa</a>
</div>

<!-- ADMIN GİRİŞ -->
<div class="box admin-box hidden" id="adminLogin">
  <h2>Yönetim Girişi</h2>
  <input id="aUser" placeholder="Kullanıcı Adı">
  <input id="aPass" type="password" placeholder="Şifre">
  <button onclick="adminLogin()">Giriş</button>
  <a onclick="location.reload()">Ana Sayfa</a>
</div>

<!-- MÜŞTERİ PANEL -->
<div class="panel hidden" id="customerPanel">
  <div class="top">
    <h2>Müşteri Merkezi</h2>
    <button onclick="logout()">Çıkış</button>
  </div>
  <p>Hoş geldin <b id="cusName"></b></p>
</div>

<!-- ADMIN PANEL -->
<div class="panel hidden" id="adminPanel">
  <div class="top">
    <h2>Admin Paneli</h2>
    <button onclick="logout()">Çıkış</button>
  </div>
  <p>Yönetici olarak giriş yapıldı.</p>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser="";

function show(id){
  document.querySelectorAll(".box,.panel").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function register(){
  users.push({
    user:rUser.value,
    mail:rMail.value,
    pass:rPass.value
  });
  localStorage.setItem("users",JSON.stringify(users));
  alert("Kayıt başarılı, giriş yapabilirsiniz");
  location.reload();
}

function customerLogin(){
  let u=cUser.value,p=cPass.value;
  let ok=users.find(x=>x.user===u && x.pass===p);
  if(ok){
    currentUser=u;
    document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
    customerPanel.classList.remove("hidden");
    cusName.innerText=u;
  }else alert("Bilgiler yanlış");
}

function adminLogin(){
  if(aUser.value==="barisguzel" && aPass.value==="baro1453"){
    document.querySelectorAll(".box").forEach(x=>x.classList.add("hidden"));
    adminPanel.classList.remove("hidden");
  }else alert("Admin bilgileri hatalı");
}

function logout(){location.reload()}
</script>

</body>
</html>
