<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Müşteri Girişi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MÜŞTERİ GİRİŞ -->
<div class="box" id="loginBox">
  <h2>Müşteri Girişi</h2>

  <input id="logUser" placeholder="Kullanıcı Adı">
  <input id="logPass" type="password" placeholder="Şifre">

  <button onclick="login()">Giriş</button>

  <a href="javascript:void(0)" onclick="showRegister()">Kayıt Ol</a>
  <a href="javascript:void(0)">Şifremi Unuttum</a>
</div>

<!-- KAYIT OL -->
<div class="box" id="registerBox" style="display:none">
  <h2>Kayıt Ol</h2>

  <input id="regUser" placeholder="Kullanıcı Adı">
  <input id="regMail" placeholder="E-posta">
  <input id="regPass" type="password" placeholder="Şifre">

  <button onclick="register()">Kaydı Tamamla</button>
  <a href="javascript:void(0)" onclick="showLogin()">Geri Dön</a>
</div>

<!-- YÖNETİM GİRİŞ BUTONU -->
<div class="admin-entry">
  <button onclick="location.href='admin.html'">
    ⚡ YÖNETİM GİRİŞİ ⚡
  </button>
</div>

<script src="script.js"></script>
</body>
</html>
