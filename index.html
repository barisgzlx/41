<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Müşteri & Yönetim Sistemi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial}
body{
  margin:0;
  min-height:100vh;
  background:#020024;
  background:radial-gradient(circle at top,#0ff 0%,#020024 60%);
  color:#fff;
  overflow-x:hidden;
}
.hidden{display:none}

/* ===== MÜŞTERİ NEON PANEL ===== */
.customer-box{
  max-width:420px;
  margin:80px auto;
  padding:30px;
  background:rgba(0,0,0,0.7);
  border-radius:15px;
  box-shadow:0 0 20px #0ff,0 0 60px #0ff;
  text-align:center;
}
.customer-box h2{
  color:#0ff;
  text-shadow:0 0 10px #0ff;
}
.customer-box input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}
.customer-box button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#0ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #0ff;
}
.customer-box button:hover{
  box-shadow:0 0 30px #0ff;
}
.customer-box a{
  display:block;
  margin-top:12px;
  color:#0ff;
  cursor:pointer;
}

/* ===== ADMIN GİRİŞ (SOL ALT) ===== */
.admin-box{
  position:fixed;
  bottom:20px;
  left:20px;
  width:260px;
  background:#111;
  padding:20px;
  border-radius:12px;
  border:1px solid #444;
}
.admin-box h3{
  margin-top:0;
  color:#ccc;
}
.admin-box input{
  width:100%;
  padding:10px;
  margin:6px 0;
}
.admin-box button{
  width:100%;
  padding:10px;
  background:#333;
  color:#fff;
  border:none;
  cursor:pointer;
}
.admin-box button:hover{
  background:#555;
}

/* ===== PANELLER ===== */
.panel{
  max-width:900px;
  margin:40px auto;
  background:#fff;
  color:#000;
  padding:25px;
  border-radius:12px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
</style>
</head>
<body>

<!-- MÜŞTERİ GİRİŞ -->
<div class="customer-box" id="loginBox">
  <h2>Müşteri Girişi</h2>
  <input id="loginUser" placeholder="Kullanıcı Adı">
  <input id="loginPass" type="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <a onclick="showRegister()">Kayıt Ol</a>
</div>

<!-- MÜŞTERİ KAYIT -->
<div class="customer-box hidden" id="registerBox">
  <h2>Müşteri Kayıt</h2>
  <input id="regUser" placeholder="Kullanıcı Adı">
  <input id="regMail" placeholder="E-posta">
  <input id="regPass" type="password" placeholder="Şifre">
  <button onclick="register()">Kayıt Ol</button>
  <a onclick="showLogin()">Geri Dön</a>
</div>

<!-- ADMIN GİRİŞ -->
<div class="admin-box" id="adminLogin">
  <h3>Yönetim Girişi</h3>
  <input id="adminUser" placeholder="Kullanıcı Adı">
  <input id="adminPass" type="password" placeholder="Şifre">
  <button onclick="adminLogin()">Giriş</button>
</div>

<!-- MÜŞTERİ PANEL -->
<div class="panel hidden" id="customerPanel">
  <div class="top">
    <h2>Müşteri Merkezi</h2>
    <button onclick="logout()">Çıkış</button>
  </div>
  <p>Hoş geldin <b id="userName"></b></p>
</div>

<!-- ADMIN PANEL -->
<div class="panel hidden" id="adminPanel">
  <div class="top">
    <h2>Admin Paneli</h2>
    <button onclick="logout()">Çıkış</button>
  </div>
  <p>Yönetici olarak giriş yapıldı.</p>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = "";

// Görünüm
function showRegister(){
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
}
function showLogin(){
  registerBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
}

// Kayıt
function register(){
  if(!regUser.value || !regMail.value || !regPass.value){
    alert("Tüm alanları doldur");
    return;
  }
  users.push({
    user: regUser.value,
    mail: regMail.value,
    pass: regPass.value
  });
  localStorage.setItem("users", JSON.stringify(users));
  alert("Kayıt başarılı, giriş yapabilirsin");
  showLogin();
}

// Müşteri giriş
function login(){
  let u = loginUser.value;
  let p = loginPass.value;
  let found = users.find(x => x.user === u && x.pass === p);
  if(found){
    currentUser = u;
    loginBox.classList.add("hidden");
    registerBox.classList.add("hidden");
    adminLogin.classList.add("hidden");
    customerPanel.classList.remove("hidden");
    userName.innerText = u;
  }else{
    alert("Bilgiler yanlış");
  }
}

// Admin giriş
function adminLogin(){
  if(adminUser.value === "barisguzel" && adminPass.value === "baro1453"){
    loginBox.classList.add("hidden");
    registerBox.classList.add("hidden");
    adminLogin.classList.add("hidden");
    adminPanel.classList.remove("hidden");
  }else{
    alert("Admin bilgileri hatalı");
  }
}

function logout(){
  location.reload();
}
</script>

</body>
</html>
